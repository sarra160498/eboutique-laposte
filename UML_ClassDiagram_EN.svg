<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<style>
  .cn{ font-size:12.5px; font-weight:700; fill:#fff; text-anchor:middle; }
  .a{ font-size:11px; fill:#1f2430; }
  .rt{ font-size:11px; fill:#d15b6b; }
  .gt{ font-size:11px; fill:#1f7a52; }
  .sep{ stroke:#2b3a6b; stroke-width:1; }
  .rel{ stroke:#3a3f52; stroke-width:1.3; fill:none; }
  .dep{ stroke:#6b6f86; stroke-width:1.3; stroke-dasharray:6 3; fill:none; }
  .ml{ font-size:11px; fill:#1f2430; }
  .rl{ font-size:12px; font-weight:700; fill:#1c2a5e; text-anchor:middle; }
  .dl{ font-size:11px; font-style:italic; fill:#6b6f86; text-anchor:middle; }
  .ttl{ font-size:17px; font-weight:700; fill:#1f2430; text-anchor:middle; }
</style>
<rect x="0" y="0" width="1200" height="900" fill="#ffffff"/>
<text class="ttl" x="600" y="26">Class Diagram — e-Boutique Tunisian Post</text>

<!-- relations -->
<path class="rel" d="M132 167 L132 225"/><text class="ml" x="138" y="187">1</text><text class="ml" x="138" y="220">0..*</text>
<path class="rel" d="M330 460 L490 262"/><text class="ml" x="336" y="476">1</text><text class="ml" x="472" y="256">0..*</text><text class="rl" x="575" y="335">sender / recipient</text>
<path class="rel" d="M307 355 L460 452"/><text class="ml" x="315" y="340">1</text><text class="ml" x="440" y="446">0..*</text><text class="rl" x="392" y="398">dropped at</text>
<path class="rel" d="M355 505 L460 505"/><text class="ml" x="360" y="497">1</text><text class="ml" x="438" y="497">0..*</text><text class="rl" x="405" y="524">places {customer}</text>
<path class="rel" d="M730 545 L800 545"/><text class="ml" x="733" y="536">1..*</text><text class="ml" x="790" y="536">*</text><text class="rl" x="765" y="566">contains</text>
<path class="dep" d="M730 460 L800 400"/><text class="dl" x="768" y="424">«computes fees»</text>
<path class="rel" d="M355 620 L800 755"/><text class="ml" x="360" y="634">*</text><text class="ml" x="785" y="750">*</text><text class="rl" x="600" y="708">team_members</text>
<path class="rel" d="M355 640 L460 745"/><text class="ml" x="362" y="636">1</text><text class="ml" x="445" y="740">0..*</text><text class="rl" x="392" y="700">submits</text>

<!-- Region -->
<rect x="45" y="95" width="215" height="72" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="45" y="95" width="215" height="26" fill="#1c2a5e"/><text class="cn" x="152" y="113">Region</text><text class="a" x="54" y="140">+ id : int «PK»</text><text class="a" x="54" y="158">+ name : string</text>

<!-- Bureau -->
<rect x="45" y="225" width="262" height="130" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="45" y="225" width="262" height="26" fill="#1c2a5e"/><text class="cn" x="176" y="243">Bureau</text>
<text class="a" x="54" y="270">+ id : int «PK»</text><text class="a" x="54" y="288">+ name · city · governorate</text><text class="a" x="54" y="306">+ regionId : int «FK»</text><text class="a" x="54" y="324">+ lat / lng : decimal</text>

<!-- Message -->
<rect x="460" y="110" width="270" height="150" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="460" y="110" width="270" height="26" fill="#1c2a5e"/><text class="cn" x="595" y="128">Message</text>
<text class="a" x="469" y="155">+ id : int «PK»</text><text class="a" x="469" y="173">+ senderId : int «FK»</text><text class="a" x="469" y="191">+ recipientId : int «FK»</text><text class="a" x="469" y="209">+ contentCipher (AES-GCM)</text><text class="a" x="469" y="227">+ iv / tag : string</text><text class="a" x="469" y="245">+ createdAt : datetime</text>

<!-- ShippingRate -->
<rect x="800" y="235" width="250" height="160" rx="2" fill="#fff" stroke="#1f7a52"/><rect x="800" y="235" width="250" height="26" fill="#1f7a52"/><text class="cn" x="925" y="253">★ ShippingRate</text>
<text class="a" x="809" y="280">+ id : int «PK»</text><text class="a" x="809" y="298">+ zone : enum</text><text class="a" x="809" y="316">+ basePrice : decimal</text><text class="a" x="809" y="334">+ pricePerKg : decimal</text><text class="a" x="809" y="352">+ urgentMultiplier : decimal</text><line class="sep" x1="800" y1="362" x2="1050" y2="362"/><text class="gt" x="809" y="382">+ quote() ★</text>

<!-- User -->
<rect x="45" y="430" width="310" height="252" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="45" y="430" width="310" height="26" fill="#1c2a5e"/><text class="cn" x="200" y="448">User</text>
<text class="a" x="54" y="475">+ id : int «PK»</text>
<text class="a" x="54" y="493">+ firstName / lastName : string</text>
<text class="a" x="54" y="511">+ email · passwordHash : string</text>
<text class="a" x="54" y="529">+ role : enum</text>
<text class="a" x="54" y="547">+ bureauId «FK» · regionId «FK»</text>
<text class="rt" x="54" y="565">★ cin · phone · ccp · edinarCode</text>
<text class="rt" x="54" y="583">★ balance : decimal</text>
<text class="rt" x="54" y="601">★ emailVerified · twofaEnabled : bool</text>
<line class="sep" x1="45" y1="611" x2="355" y2="611"/>
<text class="a" x="54" y="631">+ register() / verifyEmail()</text>
<text class="gt" x="54" y="649">+ verifyOtp() · resetPassword() ★</text>
<text class="gt" x="54" y="667">+ updateProfile() ★</text>


<!-- Order -->
<rect x="460" y="430" width="270" height="228" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="460" y="430" width="270" height="26" fill="#1c2a5e"/><text class="cn" x="595" y="448">Order</text>
<text class="a" x="469" y="475">+ id : int «PK»</text><text class="a" x="469" y="492">+ userId : int «FK»</text><text class="a" x="469" y="509">+ bureauId : int «FK» (drop-off)</text><text class="a" x="469" y="526">+ reference : string</text><text class="a" x="469" y="543">+ type / status : enum</text><text class="a" x="469" y="560">+ amount : decimal</text><text class="a" x="469" y="577">+ paymentMethod : enum</text><text class="a" x="469" y="594">+ linesJson : text</text><text class="a" x="469" y="611">+ createdAt : datetime</text><line class="sep" x1="460" y1="621" x2="730" y2="621"/><text class="a" x="469" y="640">+ updateStatus()</text><text class="gt" x="469" y="656">+ notifyStatusChange() ★</text>

<!-- Product -->
<rect x="800" y="470" width="250" height="150" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="800" y="470" width="250" height="26" fill="#1c2a5e"/><text class="cn" x="925" y="488">Product</text>
<text class="a" x="809" y="515">+ id : int «PK»</text><text class="a" x="809" y="533">+ category : enum</text><text class="a" x="809" y="551">+ name : string</text><text class="a" x="809" y="569">+ description : string</text><text class="a" x="809" y="587">+ price : decimal</text><text class="a" x="809" y="605">+ badge : string</text>

<!-- Team (mission added) -->
<rect x="800" y="690" width="250" height="130" rx="2" fill="#fff" stroke="#2b3a6b"/><rect x="800" y="690" width="250" height="26" fill="#1c2a5e"/><text class="cn" x="925" y="708">Team</text>
<text class="a" x="809" y="735">+ id : int «PK»</text><text class="a" x="809" y="753">+ name · description</text><text class="rt" x="809" y="771">★ mission : enum (none/admin/sav)</text><text class="a" x="809" y="789">+ responsibleUserId «FK»</text>

<!-- Claim -->
<rect x="460" y="690" width="270" height="120" rx="2" fill="#fff" stroke="#d76a6a"/><rect x="460" y="690" width="270" height="26" fill="#d76a6a"/><text class="cn" x="595" y="708">★ Claim</text>
<text class="a" x="469" y="735">+ id : int «PK»</text><text class="a" x="469" y="752">+ userId : int «FK»</text><text class="a" x="469" y="769">+ reference : string (parcel)</text><text class="a" x="469" y="786">+ type : enum (damaged/lost)</text><text class="a" x="469" y="803">+ status : enum · description</text>
</svg>
