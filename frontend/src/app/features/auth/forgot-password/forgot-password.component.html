<section class="auth-wrap">
  <div class="auth-card">
    <span class="kicker">Espace client</span>
    <h1>Mot de passe oublié</h1>
    <p class="sub">Saisissez votre e-mail : nous vous enverrons un lien pour réinitialiser votre mot de passe.</p>

    @if (done()) {
      <div class="auth-info"><p>{{ done() }}</p></div>
      <p class="auth-switch"><a routerLink="/connexion">Retour à la connexion</a></p>
    } @else {
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        @if (error()) {
          <div class="auth-error">{{ error() }}</div>
        }

        <label>
          <span>Email</span>
          <input type="email" formControlName="email" placeholder="sarra@example.tn" autocomplete="email">
          @if (form.controls.email.touched && form.controls.email.invalid) {
            <em class="err">Email invalide</em>
          }
        </label>

        <button class="auth-submit" type="submit" [disabled]="loading()">
          {{ loading() ? 'Envoi…' : 'Envoyer le lien' }}
        </button>
      </form>

      <p class="auth-switch">
        <a routerLink="/connexion">Retour à la connexion</a>
      </p>
    }
  </div>
</section>
