<section class="auth-wrap">
  <div class="auth-card">
    <span class="kicker">Espace client</span>
    <h1>Nouveau mot de passe</h1>

    @if (missingToken()) {
      <div class="auth-error">Lien invalide : jeton manquant.</div>
      <p class="auth-switch"><a routerLink="/mot-de-passe-oublie">Demander un nouveau lien</a></p>
    } @else if (done()) {
      <div class="auth-info"><p>{{ done() }}</p></div>
      <p class="auth-switch"><a routerLink="/connexion">Se connecter</a></p>
    } @else {
      <p class="sub">Choisissez un nouveau mot de passe pour votre compte.</p>
      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        @if (error()) {
          <div class="auth-error">{{ error() }}</div>
        }

        <label>
          <span>Nouveau mot de passe</span>
          <input type="password" formControlName="password" placeholder="6 caractères minimum" autocomplete="new-password">
          @if (form.controls.password.touched && form.controls.password.invalid) {
            <em class="err">6 caractères minimum</em>
          }
        </label>

        <label>
          <span>Confirmer le mot de passe</span>
          <input type="password" formControlName="confirm" placeholder="••••••••" autocomplete="new-password">
          @if (form.controls.confirm.touched && form.controls.confirm.invalid) {
            <em class="err">Champ obligatoire</em>
          }
        </label>

        <button class="auth-submit" type="submit" [disabled]="loading()">
          {{ loading() ? 'Enregistrement…' : 'Réinitialiser le mot de passe' }}
        </button>
      </form>
    }
  </div>
</section>
