<!-- Bouton flottant -->
<button class="fab" type="button" (click)="toggle()" [class.active]="open()"
        [attr.aria-label]="open() ? 'Fermer l\'assistant' : 'Ouvrir l\'assistant colis'">
  @if (!open()) {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M21 11.5a8.38 8.38 0 0 1-8.5 8.5 8.5 8.5 0 0 1-3.8-.9L3 21l1.9-5.7A8.38 8.38 0 0 1 4 11.5 8.5 8.5 0 0 1 12.5 3 8.38 8.38 0 0 1 21 11.5z"/>
    </svg>
  } @else {
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
  }
</button>

<!-- Fenêtre de chat -->
@if (open()) {
  <div class="panel">
    <header class="panel-head">
      <div class="who">
        <span class="dot"></span>
        <div>
          <b>Assistant colis</b>
          <small>La Poste Tunisienne · en ligne</small>
        </div>
      </div>
      <button class="close" type="button" (click)="toggle()" aria-label="Fermer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="stream" #scroller>
      @for (m of messages(); track $index) {
        <div class="msg" [class.bot]="m.from === 'bot'" [class.user]="m.from === 'user'">
          <p>{{ m.text }}</p>
        </div>
      }
      @if (typing()) {
        <div class="msg bot">
          <p class="dots"><span></span><span></span><span></span></p>
        </div>
      }
    </div>

    <div class="quick">
      <button type="button" (click)="quick('Où est mon colis ?')">Où est mon colis ?</button>
      <button type="button" (click)="quick('Pourquoi ce retard ?')">Pourquoi ce retard ?</button>
      <button type="button" (click)="quick('Est-il endommagé ?')">Est-il endommagé ?</button>
    </div>

    <form class="composer" (ngSubmit)="send()">
      <input type="text" [ngModel]="draft()" (ngModelChange)="draft.set($event)"
             name="draft" placeholder="Votre message ou n° de colis…" autocomplete="off">
      <button type="submit" [disabled]="!draft().trim()" aria-label="Envoyer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 2 11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
      </button>
    </form>
  </div>
}
