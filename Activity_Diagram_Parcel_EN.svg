<svg viewBox="0 0 780 900" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<defs>
  <marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#3a3f52"/></marker>
</defs>
<style>
  .at{ font-size:11px; fill:#1f2430; text-anchor:middle; }
  .role{ font-size:8.5px; fill:#8b93a3; text-anchor:middle; }
  .fl{ stroke:#3a3f52; stroke-width:1.3; fill:none; }
  .dec{ fill:#fff6d6; stroke:#d9a441; stroke-width:1.2; }
  .gl{ font-size:9.5px; fill:#6b7280; }
  .ttl{ font-size:16px; font-weight:700; fill:#1f2430; text-anchor:middle; }
  .lg{ font-size:9px; fill:#6b7280; }
</style>
<rect x="0" y="0" width="780" height="900" fill="#ffffff"/>
<text class="ttl" x="390" y="26">Activity Diagram — Drop off &amp; pay for a parcel</text>
<rect x="470" y="40" width="10" height="10" fill="#1c2a5e"/><text class="lg" x="484" y="49">Customer</text>
<rect x="550" y="40" width="10" height="10" fill="#3f6fb0"/><text class="lg" x="564" y="49">System</text>
<rect x="626" y="40" width="10" height="10" fill="#d9a441"/><text class="lg" x="640" y="49">Agent</text>

<circle cx="390" cy="72" r="9" fill="#1c2a5e"/>
<line class="fl" x1="390" y1="81" x2="390" y2="98" marker-end="url(#ar)"/>

<g><rect x="300" y="100" width="180" height="46" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="300" y="100" width="5" height="46" fill="#1c2a5e"/><text class="at" x="392" y="122">Fill the drop-off form</text><text class="role" x="392" y="137">Customer</text></g>
<line class="fl" x1="390" y1="146" x2="390" y2="166" marker-end="url(#ar)"/>

<g><rect x="290" y="168" width="200" height="50" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="290" y="168" width="5" height="50" fill="#3f6fb0"/><text class="at" x="392" y="188">Compute shipping fees</text><text class="role" x="392" y="203">System · zone · weight · express</text></g>
<line class="fl" x1="390" y1="218" x2="390" y2="240" marker-end="url(#ar)"/>

<polygon class="dec" points="390,242 450,282 390,322 330,282"/>
<text class="at" x="390" y="279" font-size="10">Payment</text><text class="at" x="390" y="291" font-size="10">method?</text>

<path class="fl" d="M330 282 H196 V300" marker-end="url(#ar)"/>
<text class="gl" x="250" y="276">on-site</text>
<g><rect x="96" y="302" width="200" height="52" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="96" y="302" width="5" height="52" fill="#3f6fb0"/><text class="at" x="196" y="322">Save order</text><text class="role" x="196" y="337">System · status: Pending (onsite)</text></g>
<line class="fl" x1="196" y1="354" x2="196" y2="378" marker-end="url(#ar)"/>
<g><rect x="106" y="380" width="180" height="50" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="106" y="380" width="5" height="50" fill="#1c2a5e"/><text class="at" x="196" y="400">Confirmation:</text><text class="role" x="196" y="415">Customer · pay at the counter</text></g>
<path class="fl" d="M196 430 V636 H360" marker-end="url(#ar)"/>

<path class="fl" d="M450 282 H586 V300" marker-end="url(#ar)"/>
<text class="gl" x="520" y="276">online (e-Dinar)</text>
<g><rect x="486" y="302" width="200" height="46" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="486" y="302" width="5" height="46" fill="#3f6fb0"/><text class="at" x="586" y="323">Open e-Dinar gateway</text><text class="role" x="586" y="338">System</text></g>
<line class="fl" x1="586" y1="348" x2="586" y2="368" marker-end="url(#ar)"/>
<g><rect x="486" y="370" width="200" height="46" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="486" y="370" width="5" height="46" fill="#1c2a5e"/><text class="at" x="586" y="391">Enter card &amp; confirm</text><text class="role" x="586" y="406">Customer</text></g>
<line class="fl" x1="586" y1="416" x2="586" y2="436" marker-end="url(#ar)"/>
<g><rect x="486" y="438" width="200" height="52" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="486" y="438" width="5" height="52" fill="#3f6fb0"/><text class="at" x="586" y="458">Simulate payment + save order</text><text class="role" x="586" y="473">System · status: Paid</text></g>
<line class="fl" x1="586" y1="490" x2="586" y2="512" marker-end="url(#ar)"/>
<g><rect x="486" y="514" width="200" height="50" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="486" y="514" width="5" height="50" fill="#1c2a5e"/><text class="at" x="586" y="534">Confirmation + tracking no.</text><text class="role" x="586" y="549">Customer</text></g>
<path class="fl" d="M586 564 V636 H420" marker-end="url(#ar)"/>

<polygon class="dec" points="390,616 420,641 390,666 360,641" fill="#eef1f7" stroke="#8ba0c8"/>
<line class="fl" x1="390" y1="666" x2="390" y2="690" marker-end="url(#ar)"/>

<g><rect x="286" y="692" width="208" height="52" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="286" y="692" width="5" height="52" fill="#d9a441"/><text class="at" x="392" y="712">Update parcel status</text><text class="role" x="392" y="727">Agent · Received → … → Delivered</text></g>
<line class="fl" x1="390" y1="744" x2="390" y2="766" marker-end="url(#ar)"/>

<g><rect x="290" y="768" width="200" height="46" rx="10" fill="#fff" stroke="#1c2a5e"/><rect x="290" y="768" width="5" height="46" fill="#3f6fb0"/><text class="at" x="392" y="789">Send e-mail notification</text><text class="role" x="392" y="804">System</text></g>
<line class="fl" x1="390" y1="814" x2="390" y2="836" marker-end="url(#ar)"/>

<circle cx="390" cy="848" r="10" fill="none" stroke="#1c2a5e" stroke-width="1.5"/>
<circle cx="390" cy="848" r="5" fill="#1c2a5e"/>
</svg>
