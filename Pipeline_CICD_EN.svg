<svg viewBox="0 0 1080 560" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<defs>
  <marker id="ar" markerWidth="11" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#1c2a5e"/></marker>
</defs>
<style>
  .ttl{ font-size:18px; font-weight:700; fill:#1f2430; text-anchor:middle; }
  .sub{ font-size:11px; fill:#6b7280; text-anchor:middle; }
  .sn{ font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; }
  .sd{ font-size:9.5px; fill:#5b6270; text-anchor:middle; }
  .stg{ font-size:10.5px; font-weight:700; fill:#1c2a5e; text-anchor:middle; }
  .fl{ stroke:#1c2a5e; stroke-width:1.8; fill:none; }
  .lane{ font-size:11px; font-weight:700; fill:#8a76c4; }
  .cap{ font-size:9.5px; fill:#7a5a10; text-anchor:middle; }
</style>
<rect x="0" y="0" width="1080" height="560" fill="#ffffff"/>
<text class="ttl" x="540" y="34">CI/CD Pipeline — e-Boutique Tunisian Post (GitHub Actions)</text>
<text class="sub" x="540" y="54">Triggered automatically on every git push / pull request</text>

<!-- trigger -->
<rect x="40" y="120" width="130" height="80" rx="10" fill="#1c2a5e"/><text class="sn" x="105" y="150">git push</text><text class="sn" x="105" y="168" font-weight="400" font-size="10">/ pull request</text><text class="sd" x="105" y="188" fill="#dfe6f5">developer</text>

<line class="fl" x1="170" y1="160" x2="214" y2="160" marker-end="url(#ar)"/>

<!-- GitHub Actions runner box -->
<rect x="220" y="80" width="700" height="400" rx="12" fill="#faf9ff" stroke="#8a76c4" stroke-dasharray="6 5"/>
<text class="lane" x="240" y="104">GitHub Actions runner (Ubuntu · Node 20)</text>

<!-- Frontend lane -->
<text class="stg" x="450" y="140" text-anchor="start" fill="#5b83c4">▸ Job 1 — Frontend (Angular)</text>
<rect x="250" y="150" width="150" height="70" rx="9" fill="#eef2fb" stroke="#5b83c4"/><text class="stg" x="325" y="180">Checkout</text><text class="sd" x="325" y="198">clone the repo</text>
<rect x="425" y="150" width="150" height="70" rx="9" fill="#eef2fb" stroke="#5b83c4"/><text class="stg" x="500" y="180">Install</text><text class="sd" x="500" y="198">npm install</text>
<rect x="600" y="150" width="150" height="70" rx="9" fill="#eef2fb" stroke="#5b83c4"/><text class="stg" x="675" y="180">Build</text><text class="sd" x="675" y="198">ng build (prod)</text>
<line class="fl" x1="400" y1="185" x2="424" y2="185" marker-end="url(#ar)"/>
<line class="fl" x1="575" y1="185" x2="599" y2="185" marker-end="url(#ar)"/>
<rect x="775" y="160" width="120" height="50" rx="9" fill="#e9f5ee" stroke="#3f9d5c"/><text class="stg" x="835" y="182" fill="#2e7d46">✅ artifact</text><text class="sd" x="835" y="198">dist/ bundle</text>
<line class="fl" x1="750" y1="185" x2="774" y2="185" marker-end="url(#ar)"/>

<!-- Backend lane -->
<text class="stg" x="450" y="272" text-anchor="start" fill="#d9a441">▸ Job 2 — Backend (Node/Express + MySQL)</text>
<rect x="250" y="282" width="150" height="70" rx="9" fill="#fff6e6" stroke="#d9a441"/><text class="stg" x="325" y="312">Install</text><text class="sd" x="325" y="330">npm install</text>
<rect x="425" y="282" width="150" height="70" rx="9" fill="#fff6e6" stroke="#d9a441"/><text class="stg" x="500" y="308">Syntax check</text><text class="sd" x="500" y="326">node --check</text>
<rect x="600" y="282" width="150" height="70" rx="9" fill="#fff6e6" stroke="#d9a441"/><text class="stg" x="675" y="304">Start API</text><text class="sd" x="675" y="320">+ init tables</text><text class="sd" x="675" y="334">/api/health ✔</text>
<line class="fl" x1="400" y1="317" x2="424" y2="317" marker-end="url(#ar)"/>
<line class="fl" x1="575" y1="317" x2="599" y2="317" marker-end="url(#ar)"/>
<rect x="775" y="292" width="120" height="50" rx="9" fill="#e9f5ee" stroke="#3f9d5c"/><text class="stg" x="835" y="314" fill="#2e7d46">✅ API OK</text><text class="sd" x="835" y="330">boots &amp; responds</text>
<line class="fl" x1="750" y1="317" x2="774" y2="317" marker-end="url(#ar)"/>

<!-- MySQL service -->
<rect x="600" y="380" width="150" height="56" rx="9" fill="#fff" stroke="#3f9d5c" stroke-dasharray="4 3"/><text class="stg" x="675" y="404" fill="#2e7d46">MySQL 8 service</text><text class="sd" x="675" y="422">disposable test DB</text>
<line class="fl" x1="675" y1="380" x2="675" y2="354" marker-end="url(#ar)"/>

<!-- CD deploy -->
<line class="fl" x1="920" y1="250" x2="964" y2="250" marker-end="url(#ar)"/>
<rect x="970" y="150" width="90" height="200" rx="10" fill="#1c2a5e"/><text class="sn" x="1015" y="180">Deploy</text><text class="sd" x="1015" y="200" fill="#dfe6f5">(CD)</text><text class="sd" x="1015" y="234" fill="#dfe6f5">Front →</text><text class="sd" x="1015" y="248" fill="#dfe6f5">Netlify</text><text class="sd" x="1015" y="278" fill="#dfe6f5">API →</text><text class="sd" x="1015" y="292" fill="#dfe6f5">Render</text><text class="sd" x="1015" y="322" fill="#dfe6f5">optional</text>

<rect x="40" y="470" width="1000" height="66" rx="8" fill="#fff6e6" stroke="#d9a441"/>
<text class="cap" x="540" y="494" font-weight="700" font-size="11">CI = Continuous Integration (build &amp; verify on every push)   ·   CD = Continuous Deployment (auto-publish)</text>
<text class="cap" x="540" y="514">If any stage fails, the pipeline stops and GitHub shows a red ✗ on the commit — broken code never reaches the main branch.</text>
</svg>
