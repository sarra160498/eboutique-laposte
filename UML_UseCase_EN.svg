<text class="leg" x="450" y="686" font-style="italic">The chatbot is open to all. Every logged-in case — including Submit a claim and Process claims — «include» Authentication (2FA for admins).</text>
<text class="leg" x="450" y="702" font-style="italic">★ extend cases: Verify e-mail, 2FA verification and Reset password extend Sign up/Log in and Manage account; Compute fees extends Drop off a parcel.</text>
<text class="leg" x="450" y="716" font-style="italic">Staff access is granted by team mission: an « admin » team unlocks Administration, a « SAV » team unlocks Process claims.</text>
