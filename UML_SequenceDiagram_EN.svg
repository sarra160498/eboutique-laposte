<svg viewBox="0 0 1720 1640" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
<defs>
  <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6 Z" fill="#3a3f52"/></marker>
  <marker id="arwo" markerWidth="12" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0 L9 3 L0 6" fill="none" stroke="#3a3f52" stroke-width="1"/></marker>
</defs>
<style>
  .ttl{ font-size:18px; font-weight:700; fill:#1f2430; text-anchor:middle; }
  .pn{ font-size:11px; font-weight:700; fill:#fff; text-anchor:middle; }
  .st{ font-size:8.5px; font-style:italic; fill:#cdd6e6; text-anchor:middle; }
  .life{ stroke:#b9c4d4; stroke-width:1.2; stroke-dasharray:4 4; }
  .msg{ stroke:#3a3f52; stroke-width:1.3; fill:none; }
  .ret{ stroke:#3a3f52; stroke-width:1.1; stroke-dasharray:5 3; fill:none; }
  .ml{ font-size:10px; fill:#1f2430; text-anchor:middle; }
  .mlg{ font-size:10px; fill:#1f7a52; font-weight:600; text-anchor:middle; }
  .act{ fill:#e7edf7; stroke:#8ba0c8; stroke-width:1; }
  .divl{ stroke:#8a76c4; stroke-width:1; stroke-dasharray:6 4; }
  .dtag{ font-size:10px; font-weight:700; fill:#8a76c4; }
  .note{ fill:#fff6d6; stroke:#d9a441; stroke-width:1; }
  .notet{ font-size:9.5px; font-weight:700; fill:#7a5a10; text-anchor:middle; }
</style>
<rect x="0" y="0" width="1720" height="1640" fill="#ffffff"/>
<text class="ttl" x="860" y="30">Sequence Diagram — "Parcel life cycle" (fee · e-Dinar payment · invoice · agent → manager → courier · notifications)</text>
<g>
  <rect x="10" y="52" width="140" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="80" y="70">«actor»</text><text class="pn" x="80" y="84">Customer</text>
  <rect x="185" y="52" width="150" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="260" y="68">«UI» + e-Dinar</text><text class="pn" x="260" y="82">Angular SPA</text>
  <rect x="385" y="52" width="150" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="460" y="68">«control»</text><text class="pn" x="460" y="82">Shipping Ctrl</text>
  <rect x="585" y="52" width="150" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="660" y="68">«control»</text><text class="pn" x="660" y="82">Order Ctrl</text>
  <rect x="805" y="52" width="150" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="880" y="70">«entity»</text><text class="pn" x="880" y="84">DB MySQL</text>
  <rect x="1015" y="52" width="150" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="1090" y="70">«external»</text><text class="pn" x="1090" y="84">Mailer SMTP</text>
  <rect x="1210" y="52" width="140" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="1280" y="70">«actor»</text><text class="pn" x="1280" y="84">Agent</text>
  <rect x="1380" y="52" width="140" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="1450" y="70">«actor»</text><text class="pn" x="1450" y="84">Manager (office)</text>
  <rect x="1550" y="52" width="140" height="42" rx="3" fill="#1c2a5e"/><text class="st" x="1620" y="70">«actor»</text><text class="pn" x="1620" y="84">Courier</text>
</g>
<g class="life">
  <line x1="80" y1="94" x2="80" y2="1580"/><line x1="260" y1="94" x2="260" y2="1580"/><line x1="460" y1="94" x2="460" y2="1580"/><line x1="660" y1="94" x2="660" y2="1580"/><line x1="880" y1="94" x2="880" y2="1580"/><line x1="1090" y1="94" x2="1090" y2="1580"/><line x1="1280" y1="94" x2="1280" y2="1580"/><line x1="1450" y1="94" x2="1450" y2="1580"/><line x1="1620" y1="94" x2="1620" y2="1580"/>
</g>
<rect class="act" x="255" y="150" width="10" height="1370"/><rect class="act" x="455" y="184" width="10" height="130"/><rect class="act" x="655" y="452" width="10" height="190"/><rect class="act" x="655" y="746" width="10" height="800"/>

<!-- Phase 1 -->
<line class="divl" x1="10" y1="128" x2="1710" y2="128"/><rect x="10" y="118" width="300" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="131">Phase 1 — Drop-off form &amp; fee calculation</text>
<text class="ml" x="170" y="150">fills the drop-off form</text><line class="msg" x1="80" y1="160" x2="255" y2="160" marker-end="url(#arw)"/>
<text class="ml" x="360" y="180">POST /shipping/quote</text><line class="msg" x1="265" y1="190" x2="455" y2="190" marker-end="url(#arw)"/>
<text class="ml" x="670" y="212">SELECT shipping_rates (zone)</text><line class="msg" x1="465" y1="222" x2="875" y2="222" marker-end="url(#arw)"/>
<line class="ret" x1="880" y1="246" x2="465" y2="246" marker-end="url(#arwo)"/><text class="ml" x="670" y="242">zone rate</text>
<path class="msg" d="M465 262 h58 v20 h-58" marker-end="url(#arw)"/><text class="mlg" x="640" y="276">compute fees = base + billedKg × pricePerKg (× urgent) ★</text>
<line class="ret" x1="455" y1="302" x2="265" y2="302" marker-end="url(#arwo)"/><text class="ml" x="360" y="298">{ total }</text>

<!-- Phase 2 -->
<line class="divl" x1="10" y1="330" x2="1710" y2="330"/><rect x="10" y="320" width="330" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="333">Phase 2 — e-Dinar payment (online, simulated client-side)</text>
<text class="ml" x="170" y="356">chooses "pay online" → e-Dinar</text><line class="msg" x1="80" y1="366" x2="255" y2="366" marker-end="url(#arw)"/>
<path class="msg" d="M265 380 h60 v20 h-60" marker-end="url(#arw)"/><rect class="note" x="332" y="378" width="210" height="26" rx="3"/><text class="notet" x="437" y="394">e-Dinar simulation (front-end)</text>

<!-- Phase 3 -->
<line class="divl" x1="10" y1="428" x2="1710" y2="428"/><rect x="10" y="418" width="400" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="431">Phase 3 — Order registration &amp; invoice e-mail</text>
<text class="ml" x="460" y="452">POST /orders { status:'paid', paymentMethod:'online' }</text><line class="msg" x1="265" y1="462" x2="655" y2="462" marker-end="url(#arw)"/>
<text class="ml" x="770" y="486">INSERT INTO orders</text><line class="msg" x1="665" y1="496" x2="875" y2="496" marker-end="url(#arw)"/>
<line class="ret" x1="880" y1="520" x2="665" y2="520" marker-end="url(#arwo)"/><text class="ml" x="770" y="516">id, reference</text>
<text class="mlg" x="880" y="544">if paymentMethod = 'online' → generate invoice PDF + e-mail ★</text><line class="msg" x1="665" y1="554" x2="1085" y2="554" marker-end="url(#arw)"/>
<line class="ret" x1="1090" y1="580" x2="80" y2="580" marker-end="url(#arwo)"/><text class="ml" x="580" y="576">e-mail "your invoice (facture)" + PDF attached</text>
<line class="ret" x1="655" y1="606" x2="265" y2="606" marker-end="url(#arwo)"/><text class="ml" x="460" y="602">201 { order, reference }</text>
<line class="ret" x1="255" y1="632" x2="80" y2="632" marker-end="url(#arwo)"/><text class="ml" x="170" y="628">confirmation + tracking no.</text>
<rect class="note" x="95" y="640" width="120" height="22" rx="3"/><text class="notet" x="155" y="655">status: Paid</text>

<!-- Phase 4a Agent -->
<line class="divl" x1="10" y1="690" x2="1710" y2="690"/><rect x="10" y="680" width="430" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="693">Phase 4a — Reception &amp; dispatch (Agent: paid → received → in_transit)</text>
<text class="ml" x="770" y="714">opens office queue</text><line class="msg" x1="1280" y1="724" x2="265" y2="724" marker-end="url(#arw)"/>
<text class="ml" x="460" y="746">GET /orders/manage (JWT)</text><line class="msg" x1="265" y1="756" x2="655" y2="756" marker-end="url(#arw)"/>
<text class="ml" x="770" y="784">SELECT drop-offs WHERE bureau_id = ?</text><line class="msg" x1="665" y1="794" x2="875" y2="794" marker-end="url(#arw)"/>
<line class="ret" x1="880" y1="818" x2="665" y2="818" marker-end="url(#arwo)"/><text class="ml" x="770" y="814">parcel list</text>
<line class="ret" x1="655" y1="842" x2="265" y2="842" marker-end="url(#arwo)"/><text class="ml" x="460" y="838">office parcels</text>
<text class="ml" x="770" y="870">sets "Received"</text><line class="msg" x1="1280" y1="880" x2="265" y2="880" marker-end="url(#arw)"/>
<text class="ml" x="460" y="902">PATCH /orders/:id/status { received }</text><line class="msg" x1="265" y1="912" x2="655" y2="912" marker-end="url(#arw)"/>
<text class="ml" x="770" y="936">UPDATE status = 'received'  (checks role + office)</text><line class="msg" x1="665" y1="946" x2="875" y2="946" marker-end="url(#arw)"/>
<text class="ml" x="770" y="972">sets "In transit"</text><line class="msg" x1="1280" y1="982" x2="265" y2="982" marker-end="url(#arw)"/>
<text class="ml" x="460" y="1004">PATCH /orders/:id/status { in_transit }</text><line class="msg" x1="265" y1="1014" x2="655" y2="1014" marker-end="url(#arw)"/>
<text class="ml" x="770" y="1038">UPDATE status = 'in_transit'</text><line class="msg" x1="665" y1="1048" x2="875" y2="1048" marker-end="url(#arw)"/>
<text class="mlg" x="885" y="1074">each status change → notifyStatusChange() e-mail ★</text><line class="msg" x1="665" y1="1084" x2="1085" y2="1084" marker-end="url(#arw)"/>
<line class="ret" x1="1090" y1="1108" x2="80" y2="1108" marker-end="url(#arwo)"/><text class="ml" x="580" y="1104">e-mail "parcel received / in transit"</text>

<!-- Phase 4b Manager -->
<line class="divl" x1="10" y1="1136" x2="1710" y2="1136"/><rect x="10" y="1126" width="430" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="1139">Phase 4b — Supervision (Manager / chef de bureau)</text>
<text class="ml" x="855" y="1160">supervises office queue</text><line class="msg" x1="1450" y1="1170" x2="265" y2="1170" marker-end="url(#arw)"/>
<text class="ml" x="460" y="1192">GET /orders/manage (all office statuses)</text><line class="msg" x1="265" y1="1202" x2="655" y2="1202" marker-end="url(#arw)"/>
<line class="ret" x1="655" y1="1226" x2="1445" y2="1226" marker-end="url(#arwo)"/><text class="ml" x="1050" y="1222">office dashboard (all parcels &amp; statuses)</text>

<!-- Phase 4c Courier -->
<line class="divl" x1="10" y1="1254" x2="1710" y2="1254"/><rect x="10" y="1244" width="470" height="18" rx="3" fill="#f3f0fb"/><text class="dtag" x="18" y="1257">Phase 4c — Delivery (Courier: in_transit → out_for_delivery → delivered)</text>
<text class="ml" x="940" y="1278">opens delivery round</text><line class="msg" x1="1620" y1="1288" x2="265" y2="1288" marker-end="url(#arw)"/>
<text class="ml" x="460" y="1310">GET /orders/manage (in_transit / out_for_delivery)</text><line class="msg" x1="265" y1="1320" x2="655" y2="1320" marker-end="url(#arw)"/>
<line class="ret" x1="655" y1="1344" x2="1615" y2="1344" marker-end="url(#arwo)"/><text class="ml" x="1135" y="1340">parcels to deliver</text>
<text class="ml" x="940" y="1370">sets "Out for delivery"</text><line class="msg" x1="1620" y1="1380" x2="265" y2="1380" marker-end="url(#arw)"/>
<text class="ml" x="460" y="1402">PATCH /orders/:id/status { out_for_delivery }</text><line class="msg" x1="265" y1="1412" x2="655" y2="1412" marker-end="url(#arw)"/>
<text class="ml" x="770" y="1436">UPDATE status = 'out_for_delivery'</text><line class="msg" x1="665" y1="1446" x2="875" y2="1446" marker-end="url(#arw)"/>
<text class="ml" x="940" y="1472">sets "Delivered"</text><line class="msg" x1="1620" y1="1482" x2="265" y2="1482" marker-end="url(#arw)"/>
<text class="ml" x="460" y="1504">PATCH /orders/:id/status { delivered }</text><line class="msg" x1="265" y1="1514" x2="655" y2="1514" marker-end="url(#arw)"/>
<text class="ml" x="770" y="1538">UPDATE status = 'delivered'</text><line class="msg" x1="665" y1="1548" x2="875" y2="1548" marker-end="url(#arw)"/>
<text class="mlg" x="885" y="1574">notifyStatusChange() → e-mail ★</text><line class="msg" x1="665" y1="1584" x2="1085" y2="1584" marker-end="url(#arw)"/>
<line class="ret" x1="1090" y1="1608" x2="80" y2="1608" marker-end="url(#arwo)"/><text class="ml" x="580" y="1604">e-mail "out for delivery" / "delivered"</text>
<rect class="note" x="95" y="1616" width="130" height="22" rx="3"/><text class="notet" x="160" y="1631">status: Delivered</text>
</svg>
